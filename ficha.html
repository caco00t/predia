<style>
:root{

}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
/* ---------- sidebar ---------- */
#side{width:384px;min-width:384px;height:100%;background:var(--card);
  border-right:1px solid var(--line);overflow-y:auto;position:relative;z-index:5}
.brand{padding:18px 20px 14px;background:linear-gradient(135deg,var(--deep),var(--deep2));color:#fff}
.brand .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.brand h1{font-size:19px;margin:3px 0 2px;font-weight:650;letter-spacing:.2px}
.brand .sub{font-size:12.5px;opacity:.85}
.graderow{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.badge{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;

.verd .t{font-size:12px;color:var(--mut)}
.verd .v{font-size:14px;font-weight:600;line-height:1.3;margin-top:2px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.metric{background:var(--card);padding:12px 16px}
.metric .n{font-size:18px;font-weight:680;color:var(--deep)}
.metric .l{font-size:11px;color:var(--mut);margin-top:1px}
.sec{padding:14px 20px;border-bottom:1px solid var(--line)}
.sec h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.toggle{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;user-select:none}
.toggle .sw{width:34px;height:20px;border-radius:12px;background:#cfd8e3;position:relative;transition:.18s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{left:16px}
.toggle .dot{width:11px;height:11px;border-radius:3px;flex:none}
.toggle .tx{font-size:13.5px}
.toggle .pc{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.ind{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.ind .hd{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.ind .lamp{width:9px;height:9px;border-radius:50%;flex:none}
.ind .nm{font-size:13.5px;font-weight:600}
.ind .cf{margin-left:auto;font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--mut)}
.ind .bd{padding:0 13px;max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease}
.ind.open .bd{max-height:260px;padding:0 13px 12px}
.ind .bd p{font-size:12.5px;color:#3c4b59;line-height:1.5;margin:0 0 6px}
.ind .bd .src{font-size:11px;color:var(--mut)}
.arrow{margin-left:6px;transition:transform .2s;color:var(--mut);font-size:11px}
.ind.open .arrow{transform:rotate(90deg)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;background:#000}
.gal img{width:100%;height:82px;object-fit:cover;display:block}
.gal figcaption{font-size:10.5px;color:var(--mut);padding:5px 7px;background:var(--card)}
.note{font-size:12px;color:#3c4b59;line-height:1.55}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--deep);
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer;width:100%;justify-content:center}
.btn:hover{background:#eef2f8}
.foot{padding:14px 20px;font-size:10.5px;color:var(--na);line-height:1.5}
/* lluvia */
#rainSec .stat{font-size:12px;color:#3c4b59;line-height:1.5;margin-bottom:10px}
#rainSec .stat b{color:var(--deep)}
.rchart{width:100%;height:68px;margin:2px 0 10px}
.rrow{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.rrow input[type=range]{flex:1;accent-color:var(--accent)}
.rrow .rv{font-size:13px;font-weight:650;color:var(--deep);width:62px;text-align:right;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{font-size:11px;border:1px solid var(--line);background:var(--bg);color:#3c4b59;border-radius:20px;
  padding:5px 10px;cursor:pointer}
.chip:hover{background:#eef2f8}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rout{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg)}
.rout .big{font-size:13px;font-weight:600;margin-bottom:7px}
.rout .ln{display:flex;justify-content:space-between;font-size:12px;color:#3c4b59;padding:3px 0}
.rout .ln b{color:var(--deep);font-variant-numeric:tabular-nums}
.rbar{height:7px;border-radius:5px;background:#dce3ec;overflow:hidden;margin:7px 0}
.rbar>i{display:block;height:100%;background:linear-gradient(90deg,#2b8cff,#1f6feb);width:0;transition:width .3s}
.verd2{font-size:12px;margin-top:8px;padding:8px 10px;border-radius:8px;line-height:1.45}
.verd2.dry{background:#eaf5ee;color:#1a6b42}.verd2.wet{background:#fdeceb;color:#9a2f2a}

.pricerow{display:flex;align-items:center;gap:8px;margin:6px 0}
.pricerow label{flex:1;font-size:12px;color:#3c4b59}
.pricerow input{width:96px;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;
  text-align:right;font-variant-numeric:tabular-nums;color:var(--deep);font-weight:600}
#eOut .big,#eVal .big{font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--deep)}
/* ---------- viewer ---------- */
#view{flex:1;position:relative;background:#0b1118;min-width:0}
#c3d{width:100%;height:100%;display:block}
.vctl{position:absolute;left:16px;bottom:16px;background:rgba(12,20,30,.82);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:#dfe7f0;width:230px}
.vctl .r{display:flex;align-items:center;gap:10px;margin:6px 0}
.vctl label{font-size:11.5px;opacity:.85;flex:none;width:72px}
.vctl input[type=range]{flex:1;accent-color:#4a90ff}
.vctl .val{font-size:11.5px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.vbtn{font-size:11.5px;color:#dfe7f0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:6px 10px;cursor:pointer}
.vbtn:hover{background:rgba(255,255,255,.16)}
.legend{position:absolute;right:16px;bottom:16px;background:rgba(12,20,30,.82);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 13px;color:#dfe7f0;font-size:11.5px}
.legend .li{display:flex;align-items:center;gap:8px;margin:4px 0}
.legend .sq{width:12px;height:12px;border-radius:3px;flex:none}
.compass{position:absolute;right:18px;top:16px;width:42px;height:42px;border-radius:50%;
  background:rgba(12,20,30,.82);border:1px solid rgba(255,255,255,.12);color:#dfe7f0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.compass b{color:#ff6b6b}
#load{position:absolute;inset:0;background:#0b1118;display:flex;align-items:center;justify-content:center;

  color:#cfe;font-size:11.5px;padding:6px 12px;border-radius:20px;pointer-events:none;transition:opacity .5s}

.ov{position:fixed;inset:0;background:rgba(7,12,20,.74);backdrop-filter:blur(3px);display:none;

.modal .mb{padding:16px 22px 22px}

.modal .mb p,.modal .mb li{font-size:13px;color:#3c4b59;line-height:1.6}
.modal .x{position:sticky;top:0;float:right;cursor:pointer;color:var(--mut);font-size:22px;line-height:1;margin:-4px -6px 0 0}

#lb.on{display:flex}#lb img{max-width:94vw;max-height:88vh;border-radius:8px}
#lb .cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#cfe;font-size:13px}
#lb .x{position:absolute;top:18px;right:24px;color:#fff;font-size:30px;cursor:pointer}

const GEO = JSON.parse(document.getElementById('payload').textContent);

function unpack(s,kind){const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(kind==='byte')return bytes;const out=new (kind==='signed'?Int16Array:Uint16Array)(bytes.length/2);const view=new DataView(bytes.buffer);for(let i=0;i<out.length;i++)out[i]=kind==='signed'?view.getInt16(i*2,true):view.getUint16(i*2,true);return out;}
GEO.terrain.z_cm=unpack(GEO.terrain.z_cm,'signed');GEO.rain.depth_cm=unpack(GEO.rain.depth_cm,'unsigned');
for(const k of ['arbolado_f','ponding_f','hidro_f'])GEO.earth[k]=unpack(GEO.earth[k],'byte');
function raster(kind){
 const T=GEO.terrain,c=document.createElement('canvas');c.width=T.cols;c.height=T.rows;const ctx=c.getContext('2d'),img=ctx.createImageData(T.cols,T.rows);
 for(let i=0;i<T.z_cm.length;i++){const valid=T.z_cm[i]>=0,j=i*4;if(!valid)continue;let r,g,b,a=255;
  if(kind==='terrain'){const h=T.z_cm[i]/Math.max(1,T.zmax*100),v=GEO.earth.arbolado_f[i]/255;r=85+h*72-v*25;g=111+h*56+v*22;b=65+h*43-v*10;}
  else {const mask=kind==='water'?GEO.earth.ponding_f[i]:kind==='flow'?GEO.earth.hidro_f[i]:GEO.earth.arbolado_f[i];a=mask*.80;[r,g,b]=kind==='water'?[31,111,235]:kind==='flow'?[34,211,238]:[73,165,91];}
  img.data[j]=r;img.data[j+1]=g;img.data[j+2]=b;img.data[j+3]=a;
 }ctx.putImageData(img,0,0);return c.toDataURL('image/png');
}
GEO.ortho=raster('terrain');
for(const L of GEO.layers)L.img=raster({ponding_geojson:'water',hidro_geojson:'flow',veg_geojson:'cover'}[L.k]);

function imgInBox(doc,data,x,y,maxW,maxH){

function cropBanner(src,asp){
  try{const sw=src.width,sh=src.height,a=sw/sh; let cw,ch;
    if(a>asp){ch=sh;cw=sh*asp;}else{cw=sw;ch=sw/asp;}
    const c=document.createElement('canvas'); c.width=Math.round(cw); c.height=Math.round(ch);

    return c.toDataURL('image/jpeg',0.9);}catch(e){return null;}
}

let scene,cam,ren,ctrl,group,terrainMesh,orthoMat,overlayMeshes={},predioLine,spin=false;
const T=GEO.terrain;
function loadTex(url){const t=new THREE.TextureLoader().load(url);t.minFilter=THREE.LinearFilter;
  t.magFilter=THREE.LinearFilter;t.generateMipmaps=false;t.anisotropy=4;return t;}
function sampleZ(cf,rf){ // metros relativos a zmin; cf,rf en [0,1]
  const C=T.cols,R=T.rows, x=cf*(C-1), y=rf*(R-1);
  const x0=Math.max(0,Math.min(C-1,Math.floor(x))), y0=Math.max(0,Math.min(R-1,Math.floor(y)));
  const v=T.z_cm[y0*C+x0]; return v<0?0:v/100;
}
/* CPU projection of the same terrain, for browsers without a WebGL context. */
function compatibleTerrainRenderer(canvas){
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('No canvas renderer available');
  let ratio=1,lastFrame=-Infinity,frameWidth=1,frameHeight=1;
  const mat=new THREE.Matrix4();
  function project(x,y,z){
    const e=mat.elements,w=e[3]*x+e[7]*y+e[11]*z+e[15];
    if(w<=0)return null;
    return {x:((e[0]*x+e[4]*y+e[8]*z+e[12])/w*.5+.5)*frameWidth,
      y:(.5-(e[1]*x+e[5]*y+e[9]*z+e[13])/w*.5)*frameHeight,
      depth:(e[2]*x+e[6]*y+e[10]*z+e[14])/w};
  }
  function point(i,y){const r=Math.floor(i/T.cols),c=i%T.cols;
    return project((c/(T.cols-1)-.5)*T.width_m,y,(r/(T.rows-1)-.5)*T.height_m);}
  function color(i){
    if(paintMesh&&paintMesh.visible&&paintCol){const a=paintCol.array;return [a[i*3]*255,a[i*3+1]*255,a[i*3+2]*255];}
    const h=T.z_cm[i]/Math.max(1,T.zmax*100),v=GEO.earth.arbolado_f[i]/255;
    let out=terrainMesh.material===orthoMat?[85+h*72-v*25,111+h*56+v*22,65+h*43-v*10]:[116+h*38,132+h*38,139+h*38];
    for(const [key,field,col] of [['veg_geojson','arbolado_f',[73,165,91]],['hidro_geojson','hidro_f',[34,211,238]],['ponding_geojson','ponding_f',[31,111,235]]]){
      if(overlayMeshes[key]&&overlayMeshes[key].visible){const alpha=GEO.earth[field][i]/255*.55;out=out.map((x,k)=>x*(1-alpha)+col[k]*alpha);}
    }
    return out;
  }
  function triangle(a,b,c,rgb,opacity=1){
    if(!a||!b||!c)return;
    ctx.globalAlpha=opacity;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();
    ctx.fillStyle=`rgb(${rgb.map(x=>Math.max(0,Math.min(255,Math.round(x)))).join(',')})`;ctx.fill();
    ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.6*ratio;ctx.stroke();ctx.globalAlpha=1;
  }
  return {
    domElement:canvas,
    setPixelRatio(v){ratio=Math.min(v,1.5);},
    setSize(w,h){canvas.width=Math.max(1,Math.round(w*ratio));canvas.height=Math.max(1,Math.round(h*ratio));canvas.style.width=w+'px';canvas.style.height=h+'px';},
    render(scene,camera){
      const now=performance.now();if(now-lastFrame<80)return;lastFrame=now;
      frameWidth=canvas.width;frameHeight=canvas.height;
      ctx.fillStyle='#0b1118';ctx.fillRect(0,0,frameWidth,frameHeight);
      scene.updateMatrixWorld(true);camera.updateMatrixWorld(true);
      mat.copy(camera.projectionMatrix).multiply(camera.matrixWorldInverse).multiply(group.matrixWorld);
      const step=2,points=new Map(),cells=[],R=T.rows,C=T.cols;
      for(let r=0;r<R-step;r+=step)for(let c=0;c<C-step;c+=step){
        const ids=[r*C+c,r*C+c+step,(r+step)*C+c,(r+step)*C+c+step];
        if(ids.some(i=>T.z_cm[i]<0))continue;
        for(const i of ids)if(!points.has(i))points.set(i,point(i,baseY[i]));
        const pp=ids.map(i=>points.get(i));if(pp.some(x=>!x))continue;
        cells.push({ids,p:pp,depth:pp.reduce((a,p)=>a+p.depth,0)/4});
      }
      cells.sort((a,b)=>b.depth-a.depth);
      for(const cell of cells){
        const i=cell.ids[0],rgb=color(i),p=cell.p;
        const shade=.88+Math.min(.20,Math.max(-.10,(baseY[i]-baseY[cell.ids[3]])*.025));
        const shaded=rgb.map(v=>v*shade);
        triangle(p[0],p[2],p[1],shaded);triangle(p[1],p[2],p[3],shaded);
        if(waterMesh&&waterMesh.visible&&fillFrac>0&&cell.ids.some(k=>GEO.rain.depth_cm[k]>0)){
          const wp=cell.ids.map(k=>point(k,baseY[k]+GEO.rain.depth_cm[k]/100*fillFrac+.07));
          triangle(wp[0],wp[2],wp[1],[41,134,240],.7);triangle(wp[1],wp[2],wp[3],[41,134,240],.7);
        }
        if(planeMesh&&planeMesh.visible&&planePos&&IPoly&&cell.ids.every(k=>IPoly[k])){
          const pp=cell.ids.map(k=>point(k,planePos.array[k*3+1]));
          triangle(pp[0],pp[2],pp[1],[185,198,220],.4);triangle(pp[1],pp[2],pp[3],[185,198,220],.4);
        }
      }
      if(predioLine&&predioLine.visible){
        const a=predioLine.geometry.attributes.position.array;ctx.beginPath();let begun=false;
        for(let k=0;k<a.length;k+=3){const p=project(a[k],a[k+1],a[k+2]);if(!p)continue;if(!begun){ctx.moveTo(p.x,p.y);begun=true;}else ctx.lineTo(p.x,p.y);}
        ctx.strokeStyle='#ffd23f';ctx.lineWidth=2*ratio;ctx.stroke();
      }
      if(drainSeg&&drainSeg.visible){
        const a=drainSeg.geometry.attributes.position.array;ctx.beginPath();
        for(let k=0;k<a.length;k+=6){if(a[k]===a[k+3]&&a[k+1]===a[k+4]&&a[k+2]===a[k+5])continue;const p=project(a[k],a[k+1],a[k+2]),q=project(a[k+3],a[k+4],a[k+5]);if(p&&q){ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);}}
        ctx.strokeStyle='#2bb8e6';ctx.lineWidth=ratio;ctx.stroke();
      }
      if(rainPts&&rainPts.visible){
        const a=rainPts.geometry.attributes.position.array;ctx.strokeStyle='#acd8f5';ctx.lineWidth=ratio;ctx.globalAlpha=.65;ctx.beginPath();
        for(let i=0;i<a.length;i+=45){const p=project(a[i],a[i+1],a[i+2]);if(p){ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-1*ratio,p.y+8*ratio);}}ctx.stroke();ctx.globalAlpha=1;
      }
    }
  };
}

let baseY=null, meanZ=0;
function buildTerrain(){
  const R=T.rows,C=T.cols,W=T.width_m,H=T.height_m;
  const pos=[],uv=[],idx=[]; baseY=new Float32Array(R*C);
  let s=0,n=0; for(let i=0;i<T.z_cm.length;i++){if(T.z_cm[i]>=0){s+=T.z_cm[i]/100;n++}} meanZ=n?s/n:0;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const i=r*C+c, zc=T.z_cm[i];
    const elev=(zc<0?meanZ:zc/100)-meanZ;
    baseY[i]=elev;
    pos.push((c/(C-1)-.5)*W, elev, (r/(R-1)-.5)*H);
    uv.push(c/(C-1), 1-r/(R-1));
  }
  const ok=i=>T.z_cm[i]>=0;
  for(let r=0;r<R-1;r++)for(let c=0;c<C-1;c++){
    const a=r*C+c,b=r*C+c+1,d=(r+1)*C+c,e=(r+1)*C+c+1;
    if(ok(a)&&ok(b)&&ok(d)&&ok(e)){idx.push(a,d,b, b,d,e);}
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx); geo.computeVertexNormals();
  window._geo=geo;
  const tex=loadTex(GEO.ortho);
  orthoMat=new THREE.MeshStandardMaterial({map:tex,roughness:.96,metalness:0});
  terrainMesh=new THREE.Mesh(geo,orthoMat); group.add(terrainMesh);
}
function buildOverlay(L){
  const tex=loadTex(L.img);
  const m=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
  const mesh=new THREE.Mesh(window._geo,m); mesh.renderOrder=2; mesh.position.y=0.15;
  group.add(mesh); overlayMeshes[L.k]=mesh;
}
function buildPredio(){
  const lon0=GEO.bounds[0],lat0=GEO.bounds[1],lon1=GEO.bounds[2],lat1=GEO.bounds[3];
  const W=T.width_m,H=T.height_m, ring=GEO.predio[0], pts=[];
  ring.forEach(p=>{const cf=(p[0]-lon0)/(lon1-lon0), rf=(lat1-p[1])/(lat1-lat0);
    pts.push(new THREE.Vector3((cf-.5)*W, sampleZ(cf,rf)-meanZ+0.6, (rf-.5)*H));});
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  predioLine=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffd23f}));
  predioLine.renderOrder=3; group.add(predioLine);
}
/* ---- agua de lluvia en 3D ---- */
let waterMesh,waterPos,fillFrac=0;
function buildWater(){
  const R=T.rows,C=T.cols,W=T.width_m,H=T.height_m,d=GEO.rain.depth_cm;
  const pos=new Float32Array(R*C*3),idx=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const i=r*C+c;
    pos[i*3]=(c/(C-1)-.5)*W; pos[i*3+1]=baseY[i]; pos[i*3+2]=(r/(R-1)-.5)*H;}
  const dd=i=>d[i]>0;
  for(let r=0;r<R-1;r++)for(let c=0;c<C-1;c++){const a=r*C+c,b=a+1,e=(r+1)*C+c,f=e+1;
    if(dd(a)||dd(b)||dd(e)||dd(f))idx.push(a,e,b,b,e,f);}  // orilla suave: cualquier esquina en bajo
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.MeshPhongMaterial({color:0x1f7fff,transparent:true,opacity:.78,depthWrite:false,
    shininess:110,specular:0x3a86c7,side:THREE.DoubleSide});
  waterMesh=new THREE.Mesh(g,m); waterMesh.renderOrder=4; waterMesh.visible=true; group.add(waterMesh);
  waterPos=g.attributes.position;
}
function setFill(f){fillFrac=f; if(!waterPos)return; const d=GEO.rain.depth_cm;
  for(let i=0;i<d.length;i++){ if(d[i]>0) waterPos.array[i*3+1]=baseY[i]+f*(d[i]/100)+0.05; }
  waterPos.needsUpdate=true;}

let rainPts,evTimer=null;
function buildRainParticles(){
  const N=2000,W=T.width_m,H=T.height_m,g=new THREE.BufferGeometry(),p=new Float32Array(N*3);
  for(let i=0;i<N;i++){p[i*3]=(Math.random()-.5)*W;p[i*3+1]=Math.random()*70;p[i*3+2]=(Math.random()-.5)*H;}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  rainPts=new THREE.Points(g,new THREE.PointsMaterial({color:0xbfe0ff,size:1.7,transparent:true,opacity:.75}));
  rainPts.visible=false; group.add(rainPts);
}
function stepRain(){ if(!rainPts||!rainPts.visible)return; const a=rainPts.geometry.attributes.position.array;
  for(let i=1;i<a.length;i+=3){a[i]-=1.5; if(a[i]<0)a[i]=70;} rainPts.geometry.attributes.position.needsUpdate=true; }
function playRainEvent(){

/* ---- simulacion de lluvia ---- */
const AREA=GEO.rain.area_m2, CAP=GEO.rain.pond_vol_m3, COEF=0.5;
function simRain(mm){
  document.getElementById('rainMmv').textContent=mm+' mm';
  const caida=AREA*mm/1000, aBajos=caida*COEF;
  const retenido=Math.min(aBajos,CAP), f=CAP>0?retenido/CAP:0, desborde=Math.max(0,aBajos-CAP);
  lastRain={mm:mm, caida:caida, retenido:retenido, cap:CAP, desborde:desborde};
  setFill(f);
  const fmt=n=>Math.round(n).toLocaleString('es-CO');
  const wet=desborde>0;
  if(wet && overlayMeshes['hidro_geojson']){overlayMeshes['hidro_geojson'].visible=true;

  const v=on&&earthReady, show=k=>{const t=document.querySelector('.toggle[data-k="'+k+'"]');return t?t.classList.contains('on'):false;};
  if(paintMesh)paintMesh.visible=v; if(earthLine)earthLine.visible=v;
  if(planeMesh)planeMesh.visible=v&&show('plane_show');
  if(drainSeg)drainSeg.visible=v&&show('drain_show');
  if(v){computeEarth();focusEarth();}
}
function applyExag(k){group.scale.y=k;document.getElementById('exagv').textContent=k.toFixed(1)+'×';}
function toggleLayer(k,on){ if(k==='predio'){predioLine.visible=on;return}
  if(k==='agua_lluvia'){if(waterMesh)waterMesh.visible=on;return}
  if(k==='earth_mode'){activateEarth(on);return}
  if(k==='plane_show'){if(planeMesh)planeMesh.visible=on&&earthOn;return}
  if(k==='drain_show'){if(drainSeg){drainSeg.visible=on&&earthOn; if(drainSeg.visible)computeEarth();}return}
  if(overlayMeshes[k])overlayMeshes[k].visible=on; }
function resetView(){const W=T.width_m;cam.position.set(W*0.05,W*0.62,W*0.92);ctrl.target.set(0,0,0);ctrl.update();}
function animate(){requestAnimationFrame(animate); if(spin)group.rotation.y+=0.0016; stepRain(); ctrl.update(); ren.render(scene,cam);}
function onResize(){const el=document.getElementById('view');cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix();ren.setSize(el.clientWidth,el.clientHeight);}
addEventListener('resize',onResize);
document.getElementById('exag').oninput=e=>applyExag(parseFloat(e.target.value));
document.getElementById('btnReset').onclick=resetView;
document.getElementById('btnSpin').onclick=()=>spin=!spin;
document.getElementById('btnOrtho').onclick=function(){
  const on=terrainMesh.material!==orthoMat;
  if(on){terrainMesh.material=orthoMat;this.style.opacity=1}
  else{terrainMesh.material=flatMat();this.style.opacity=.55}
};
let _flat;function flatMat(){if(_flat)return _flat;_flat=new THREE.MeshStandardMaterial({color:0x6f8296,roughness:1,flatShading:false});return _flat;}

buildSide();
if(window.THREE){ try { initWorld(); } catch(e) { document.getElementById('load').textContent='No se pudo iniciar el visor 3D en este navegador. Prueba otro navegador con WebGL.'; throw e; }
  document.getElementById('rainMm').oninput=e=>{setChip(null);simRain(parseInt(e.target.value));};
  document.getElementById('btnRain').onclick=playRainEvent;
  ['ePend','fExp','fDesc','fMej','pDesm','pDesc','pCut','pFill','pHaul','pMej','pAgua'].forEach(id=>{
    const el=document.getElementById(id); if(el)el.oninput=computeEarth; });
  document.getElementById('eCota').oninput=e=>{ if(polys[activeIdx])polys[activeIdx].Zc=parseFloat(e.target.value); computeEarth(); };
  document.getElementById('eOri').oninput=e=>{ const P=polys[activeIdx]; if(P){const a=parseFloat(e.target.value)*Math.PI/180;P.ux=Math.sin(a);P.uy=Math.cos(a);} computeEarth(); };
  document.getElementById('eEquil').onclick=()=>{ const P=polys[activeIdx]; if(P){P.Zc=P.eq; document.getElementById('eCota').value=P.eq.toFixed(1);} computeEarth(); };
  document.getElementById('eNat').onclick=()=>{ const P=polys[activeIdx]; if(P){const a=P.az*Math.PI/180;P.ux=Math.sin(a);P.uy=Math.cos(a); document.getElementById('eOri').value=Math.round(P.az);} computeEarth(); };
  document.getElementById('useExample').onclick=()=>loadPolygons(GEO.predio);
  document.getElementById('ePdf').onclick=generarPDF;
  loadPolygons(GEO.predio);
  document.getElementById('downloadPDF').onclick=generarPDF;
  loadRainData();
} else document.getElementById('load').textContent='No se pudo cargar el motor 3D. Revisa tu conexión y vuelve a abrir la ficha.';
</script>
</body>
